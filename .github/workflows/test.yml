name: Tests
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test core logic
        run: python -m unittest discover -s tests -v
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk libportaudio2
      - name: Test GUI on Linux
        if: runner.os == 'Linux'
        env:
          TUSIC_TEST_GUI: '1'
        run: xvfb-run -a python -m unittest discover -s tests -p '*gui.py' -v
      - name: Test GUI on Windows
        if: runner.os == 'Windows'
        env:
          TUSIC_TEST_GUI: '1'
        run: python -m unittest discover -s tests -p '*gui.py' -v
